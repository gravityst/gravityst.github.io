<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gravityst</title>
<meta name="description" content="Projects by gravityst">
<meta name="color-scheme" content="dark">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #070a10;
    color: #e8eef8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  p { color: #9aa4b2; margin-bottom: 2rem; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; width: min(360px, 100%); }
  a {
    display: block;
    padding: 0.9rem 1.1rem;
    background: #12181f;
    border: 1px solid #1e2733;
    border-radius: 10px;
    color: #e8eef8;
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s;
  }
  a:hover { border-color: #3b82f6; background: #151d28; }
  a strong { display: block; font-size: 1.05rem; }
  a span { font-size: 0.85rem; color: #9aa4b2; }
</style>
</head>
<body>
  <h1>gravityst</h1>
  <p>Browser games & experiments</p>
  <ul>
    <li>
      <a href="https://gravityst.github.io/apex-principal/">
        <strong>APEX: Principal</strong>
        <span>F1 team management simulator</span>
      </a>
    </li>
    <li>
      <a href="https://gravityst.github.io/apex-f1/">
        <strong>APEX: F1</strong>
        <span>Hyper-realistic browser Formula 1 simulator</span>
      </a>
    </li>
    <li>
      <a href="https://gravityst.github.io/OpenRoad/">
        <strong>OpenRoad</strong>
        <span>Open-world driving game</span>
      </a>
    </li>
  </ul>
</body>
</html>
